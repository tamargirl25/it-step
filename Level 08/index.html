<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>jQuery Image Gallery</h1>
        <p>Build an amazing and responsive gallery with flexbox.</p>
    </header>

    <section>
        <h2>An Example of the Gallery</h2>
        <div class="gallery">
        <img src="image1.png" alt="">
        <img src="image3.png" alt="">
        <img src="image4.png" alt="">
        <img src="image5.png" alt="">
        <img src="image6.png" alt="">
        <img src="image2.png" alt="">
        <img src="image11.png" alt="">
        <img src="image12.png" alt="">
        </div>
    </section>

    <section>
        <h2>Photo Gallery with tags</h2>
        <div class="tags">
            <div class="tag">All</div>
            <div class="tag">Beautiful</div>
            <div class="tag">Creative</div>
            <div class="tag">Cool</div>
            <div class="tag">Awsome</div>
        </div>

        <div class="gallery">
            <img src="image7.png" alt="">
            <img src="image10.png" alt="">
            <img src="image8.png" alt="">
            <img src="image9.png" alt="">
        </div>
    </section>
</body>
</html>
