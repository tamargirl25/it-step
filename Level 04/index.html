<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-ის  მაგალითები</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700&display=swap" rel="stylesheet">
    
</head>
<body>
    <h1>CSS-ის მაგალითები</h1>

    <p class="small">პატარა ტექსტი</p>
    <p class="big">დიდი ტექსტი</p>

    <div class="inline">inline</div>
    <br>
    <div class="inline-block">inline-block</div>
    <br>
    <div class="block">block</div>
    
    <div class="box">გამჭვირვალე ბლოკი</div>

    <p class="color">ფერადი ტექსტი ფერად ფონზე</p>

    <p class="styled">დეკორირებული ტექსტი</p>

    <div class="size">70% სიგანის ბლოკი</div>
    <br>
    <div class="responsive">40vw საპასუხო ბლოკი</div>
    
</body>
</html>
