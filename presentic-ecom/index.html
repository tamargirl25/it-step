<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B. Schmidt & Tagel - Premium Beer Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">B. Schmidt & Tagel</div>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#shop">Shop</a></li>
                <li><a href="#cart" class="cart-link">🛒 <span>0</span></a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <div class="hero-left">
                <p class="tagline">Curated Craft & Imported Brews –<br>A Taste of the Exceptional</p>
            </div>
            <div class="hero-center">
                <h1>JOURNEY<br>THROUGH<br>OUR BEER<br>COLLECTION</h1>
            </div>
            <div class="hero-right">
                <a href="#shop" class="btn btn-primary">Shop Now</a>
            </div>
        </div>
    </section>

    <section class="gallery">
        <div class="gallery-row">
            <div class="gallery-item">
                <img src="beer-bottle.jpg" alt="Beer Bottle">
            </div>
            <div class="gallery-item">
                <img src="beer-glass.jpg" alt="Beer Glass">
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 B. Schmidt & Tagel. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
