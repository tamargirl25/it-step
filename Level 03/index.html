<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჩემი საყვარელი წიგნები</title>
</head>
<link rel="stylesheet" href="style.css">
<style>
    table {
        font-family: arial, sans-serif;
        border-collapse: collapse;
        width: 100%;
    }

    tr {
        background-color: #2f2f2f;
    }
</style>
<body>

    <table>
        <tr>
            <th>დასახლება</th>
            <th>ჟანრი</th>
            <th>წელი</th>
        </tr>
        <tr>
            <td>ვინი პუჰი</td>
            <td>საბავშვო, სათაგადასავლო</td>
            <td>1926</td>
        </tr>
        <tr>
            <td>ჰარი პოტერი</td>
            <td>ფანტასტიკა</td>
            <td>1997</td>
        </tr>
        <tr>
            <td>ვეფხის ტყაოსანი</td>
            <td>ეპოსი</td>
            <td>12-ე საუკუნე</td>
        </tr>
        <tr>
            <td>მარტოობის ასი წელი</td>
            <td>მაგიური რეალიზმი</td>
            <td>1967</td>
        </tr>
        
    </table>
<br>
<br>
    <table>
        <tr>
            <th style="color: red;">ორშაბათი</th>
            <th style="color: red;">სამშაბათი</th>
            <th style="color: red;">ოთხშაბათი</th>
            <th style="color: green;">ხუთშაბათი</th>
            <th style="color: red;">პარასკევი</th>
            <th style="color: red;">შაბათი</th> 
            <th style="color: red;">კვირა</th>
        </tr>
    </table>

    <!--Inline სტილი (style="...") = ყველაზე მაღალი უპირატესობა.
        Internal სტილი (<style> head-ში) = მეორე ადგილზე.
        External სტილი (.css ფაილი) = ყველაზე დაბალი უპირატესობა.-->
    
        <img src="image/programpic.png" width="400px">
        
</body>
</html>
